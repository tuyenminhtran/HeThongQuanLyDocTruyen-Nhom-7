services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: storynest
      POSTGRES_PASSWORD: storynest123
      POSTGRES_DB: storyreader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: